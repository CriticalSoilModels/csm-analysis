# Shared with critical-soil-models: same env name (fpm), so one env builds every
# CriticalSoilModels repository. gfortran only (element-driver D13); LFortran is not
# supported by csm-analysis.
name: fpm
channels:
  - conda-forge
  - defaults
dependencies:
  # Fortran compiler
  - gfortran
  - gcc

  # Build tools
  - fpm

  # Notes (notes/*.typ) and the Claude Code hook that compiles them
  - typst
  - jq

  # Formatting and linting
  - fortls

  # Version control
  - git
  - pip
  - pip:
    - git+https://github.com/Fortran-FOSS-Programmers/ford.git

variables:
  FPM_FC: gfortran
