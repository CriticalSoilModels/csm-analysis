name = "fumat"
version = "0.1.0"
license = "license"
author = "WaveHello"
maintainer = "jonathanm@vt.edu"
copyright = "Copyright 2025, WaveHello"
[build]
auto-executables = true
auto-tests = true
auto-examples = true
module-naming = false

[dependencies]
stdlib = {path = "../../stdlib"}
# Invariants and the wp kind, shared with critical-soil-models and element-driver (F10)
csm-tensors = { path = "../csm-tensors" }
fortplot = { git = "https://github.com/lazy-fortran/fortplot" }

[dev-dependencies]
test-drive = { git = "https://github.com/fortran-lang/test-drive.git/" }

[extra.ford]
project = "fumat"
summary = "Modern Fortran library to plot and analyze the results of constitutive-model element tests"
src_dir = ["src", "example"]
output_dir = "build/doc"

[install]
library = true
test = false

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"



